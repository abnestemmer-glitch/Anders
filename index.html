<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lytter-figur</title>

<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  img {
    width: 320px;
    transform-origin: 70% 45%;
    animation: listening 2.8s ease-in-out infinite;
    display: block;
  }

  @keyframes listening {
    0%   { transform: rotate(0deg) translateY(0) scale(1); }
    30%  { transform: rotate(-1.8deg) translateY(-2px) scale(1.01); }
    55%  { transform: rotate(0.6deg) translateY(0) scale(1); }
    100% { transform: rotate(0deg) translateY(0) scale(1); }
  }
</style>
</head>

<body>
  <img
    src="https://drive.google.com/uc?export=view&id=1QlwKvEew8n8nmjek7NNuEv8N1pBaCSCW"
    alt="Lytter-figur">
</body>
</html>
